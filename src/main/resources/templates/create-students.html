<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create New Student</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- 🔹 Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" th:href="@{/home}">Student Management System</a>
	
    <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/students}">Student Management</a>
            </li>
        </ul>
    </div>
</nav>

<!-- 🔹 Main Form -->
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card shadow">
                <div class="card-header text-center bg-dark text-white">
                    <h2>Create New Student</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/students}" th:object="${student}" method="post">
                        <div class="form-group">
                            <label>Student First Name</label>
                            <input type="text" th:field="*{firstName}" class="form-control" placeholder="Enter Student First Name">
                        </div>
                        <div class="form-group">
                            <label>Student Last Name</label>
                            <input type="text" th:field="*{lastName}" class="form-control" placeholder="Enter Student Last Name">
                        </div>
                        <div class="form-group">
                            <label>Student Email</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="Enter Student Email">
                        </div>
                        <div class="d-flex justify-content-start mt-3">
                            <button type="submit" class="btn btn-primary mr-2">Submit</button>
                            <a th:href="@{/students}" class="btn btn-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
